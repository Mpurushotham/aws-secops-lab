name: AWS Serverless SecOps Deploy

# Manual only: this deploys with long-lived access keys. Prefer OIDC
# (aws-actions/configure-aws-credentials with role-to-assume) and then remove
# the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install -g aws-cdk@2
          pip install -r cdk/requirements.txt bandit

      - name: Security Scan (Bandit)
        run: bandit -r cdk/

      - name: Deploy CDK Stack to AWS
        working-directory: cdk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: cdk deploy --require-approval broadening
