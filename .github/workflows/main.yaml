name: SecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  synth-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install -g aws-cdk@2
          pip install -r cdk/requirements.txt bandit

      - name: Run CDK synth
        working-directory: cdk
        run: cdk synth --quiet

      - name: Security Scan (Bandit)
        run: bandit -r cdk/

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: --only-verified
